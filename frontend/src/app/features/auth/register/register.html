<section class="register-page">
    <div class="register-wrapper">
        <div class="register-header-card">
            <div class="header-texto">
                <h2>Crear cuenta</h2>
                <p>Registra tu cuenta institucional para solicitar reservas de la sala de cómputo.</p>
            </div>
        </div>

        <div class="register-card">
            <div class="register-card-header">
                <h3>Registro de profesor</h3>
                <p>Completa la siguiente información para crear tu cuenta.</p>
            </div>

            <form class="formulario-register" [formGroup]="form" (ngSubmit)="submit()">
                <div class="campo">
                    <label for="nombre">Nombre completo</label>
                    <input id="nombre" type="text" formControlName="nombreCompleto"
                        placeholder="Ingresa tu nombre completo" />
                </div>

                <div class="campo">
                    <label for="correo">Correo institucional</label>
                    <input id="correo" type="email" formControlName="correo" placeholder="nombre@uas.edu.mx" />
                </div>

                <div class="campo">
                    <label for="facultad">Facultad o unidad académica</label>
                    <select id="facultad" formControlName="facultad">
                        <option value="" disabled>Selecciona tu unidad académica</option>
                        <option value="Facultad de Ingeniería Mochis">Facultad de Ingeniería Mochis</option>
                    </select>
                </div>

                <div class="campo-grid">
                    <div class="campo">
                        <label for="contrasena">Contraseña</label>
                        <input id="contrasena" type="password" formControlName="password"
                            placeholder="Ingresa tu contraseña" />
                    </div>

                    <div class="campo">
                        <label for="confirmar">Confirmar contraseña</label>
                        <input id="confirmar" type="password" formControlName="confirmar"
                            placeholder="Repite tu contraseña" />
                    </div>
                </div>

                <p *ngIf="errorMessage" class="mensaje mensaje-error">{{ errorMessage }}</p>
                <p *ngIf="successMessage" class="mensaje mensaje-exito">{{ successMessage }}</p>

                <button type="submit" class="boton-principal" [disabled]="isSubmitting">
                    {{ isSubmitting ? 'Creando cuenta...' : 'Crear cuenta' }}
                </button>
            </form>

            <div class="acciones-extra">
                <a routerLink="/login" class="login-link">Ya tengo cuenta, iniciar sesión</a>
                <a routerLink="/" class="volver-link">Volver al calendario público</a>
            </div>
        </div>
    </div>
</section>
