<section class="historial-admin">
    <div class="encabezado">
        <h2>Historial del sistema</h2>
        <p>Consulta todas las reservas registradas.</p>
    </div>

    <p *ngIf="loading" class="text-gray-600">Cargando historial...</p>
    <p *ngIf="error" class="text-red-700">{{ error }}</p>

    <div class="tabla">
        <div class="fila encabezado">
            <span>Acción</span>
            <span>Entidad</span>
            <span>Fecha</span>
            <span>Detalle</span>
        </div>

        <div *ngFor="let item of items; trackBy: trackByIndex" class="fila">
            <span>{{ item.action }}</span>
            <span>{{ item.entity }}</span>
            <span>{{ item.date }}</span>
            <span>{{ item.detail }}</span>
        </div>
    </div>

    <p *ngIf="!loading && items.length === 0" class="text-gray-600">
        No hay movimientos registrados.
    </p>
</section>
