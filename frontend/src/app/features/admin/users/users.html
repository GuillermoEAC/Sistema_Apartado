<div>
    <div class="mb-6 flex items-center justify-between">
        <div>
            <h2 class="text-xl font-semibold text-gray-900">
                Gestión de Usuarios
            </h2>

            <p class="text-gray-600 mt-1">
                {{ filteredUsers.length }} profesor(es) registrado(s)
            </p>
        </div>

        <button
            class="flex items-center gap-2 px-4 py-2.5 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">
            Agregar Usuario
        </button>
    </div>

    <!-- Search -->
    <div class="mb-6">
        <div class="relative">
            <input type="text" placeholder="Buscar por nombre, correo o facultad..." [(ngModel)]="searchTerm"
                (ngModelChange)="applyFilter()"
                class="w-full pl-4 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none" />
        </div>
    </div>

    <p *ngIf="loading" class="text-gray-600 mb-4">Cargando usuarios...</p>
    <p *ngIf="error" class="text-red-700 mb-4">{{ error }}</p>

    <!-- Table -->
    <div class="bg-white rounded-lg border border-gray-200 overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full">
                <thead class="bg-gray-50 border-b border-gray-200">
                    <tr>
                        <th class="px-6 py-4 text-left text-sm font-semibold text-gray-900">
                            Usuario
                        </th>

                        <th class="px-6 py-4 text-left text-sm font-semibold text-gray-900">
                            Facultad
                        </th>

                        <th class="px-6 py-4 text-left text-sm font-semibold text-gray-900">
                            Reservas
                        </th>

                        <th class="px-6 py-4 text-left text-sm font-semibold text-gray-900">
                            Miembro desde
                        </th>

                        <th class="px-6 py-4 text-left text-sm font-semibold text-gray-900">
                            Estado
                        </th>

                        <th class="px-6 py-4 text-center text-sm font-semibold text-gray-900">
                            Acciones
                        </th>
                    </tr>
                </thead>

                <tbody class="divide-y divide-gray-200">
                    <tr *ngFor="let user of filteredUsers; trackBy: trackByUserId" class="hover:bg-gray-50 transition-colors">
                        <td class="px-6 py-4">
                            <div>
                                <p class="font-medium text-gray-900">
                                    {{ user.name }}
                                </p>

                                <p class="text-sm text-gray-600">
                                    {{ user.email }}
                                </p>
                            </div>
                        </td>

                        <td class="px-6 py-4">
                            <span class="text-sm text-gray-900">
                                {{ user.faculty }}
                            </span>
                        </td>

                        <td class="px-6 py-4">
                            <span class="text-sm text-gray-900">
                                {{ user.reservationCount }}
                            </span>
                        </td>

                        <td class="px-6 py-4">
                            <span class="text-sm text-gray-600">
                                {{ user.joinedDate }}
                            </span>
                        </td>

                        <td class="px-6 py-4">
                            <button (click)="toggleUserStatus(user.id)" [ngClass]="
                  user.active
                    ? 'bg-green-100 text-green-700 hover:bg-green-200'
                    : 'bg-red-100 text-red-700 hover:bg-red-200'
                " class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium transition-colors">
                                {{ user.active ? 'Activo' : 'Inactivo' }}
                            </button>
                        </td>

                        <td class="px-6 py-4">
                            <div class="flex items-center justify-center gap-2">
                                <button class="p-2 text-blue-700 hover:bg-blue-50 rounded-lg transition-colors"
                                    title="Editar usuario">
                                    Editar
                                </button>

                                <button (click)="handleDeleteUser(user.id)"
                                    class="p-2 text-red-700 hover:bg-red-50 rounded-lg transition-colors"
                                    title="Eliminar usuario">
                                    Eliminar
                                </button>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div *ngIf="filteredUsers.length === 0" class="bg-white rounded-lg border border-gray-200 p-12 text-center mt-6">
        <p class="text-gray-600">
            No se encontraron usuarios
        </p>
    </div>
</div>
