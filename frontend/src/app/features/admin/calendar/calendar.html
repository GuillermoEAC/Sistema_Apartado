<section class="home-publica">
    <header class="encabezado">
        <div class="encabezado-texto">
            <h2>Calendario Global de Reservas</h2>
            <p>Vista completa de todas las reservas de la sala</p>
        </div>
    </header>

    <div class="contenido-principal">
        <div class="columna-calendario">

            <div class="leyenda-container">
                <div class="leyenda">
                    <span class="item reservado"><span class="dot"></span> Reservado</span>
                    <span class="item pendiente"><span class="dot"></span> Pendiente</span>
                    <span class="item bloqueado"><span class="dot"></span> Bloqueado</span>
                </div>
            </div>

            <div class="calendario-preview">
                <full-calendar [options]="calendarOptions"></full-calendar>
            </div>

        </div>
    </div>
</section>
