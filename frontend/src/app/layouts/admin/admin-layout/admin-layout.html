<div class="layout-admin">
    <aside class="sidebar">
        <div class="logo">
            <h2>Sistema</h2>
            <p>Administrador</p>
        </div>

        <nav class="menu">
            <a routerLink="/admin/dashboard" routerLinkActive="active">Dashboard</a>
            <a routerLink="/admin/requests" routerLinkActive="active">Solicitudes</a>
            <a routerLink="/admin/calendar" routerLinkActive="active">Calendario</a>
            <a routerLink="/admin/users" routerLinkActive="active">Usuarios</a>
            <a routerLink="/admin/blocks" routerLinkActive="active">Bloqueos</a>
            <a routerLink="/admin/history" routerLinkActive="active">Historial</a>
        </nav>

        <div class="sidebar-footer">
            <div class="admin-user">
                <span class="admin-name">{{ user()?.nombre ?? 'Admin' }}</span>
                <span class="admin-email">{{ user()?.correo ?? '' }}</span>
            </div>
            <button class="btn-logout" (click)="logout()" title="Cerrar sesión">
                Salir
            </button>
        </div>
    </aside>

    <section class="panel-principal">
        <header class="topbar">
            <h1>Panel administrativo</h1>
        </header>

        <main class="contenido">
            <router-outlet></router-outlet>
        </main>
    </section>
</div>
